[package]
name = "bubli"
version = "0.1.4"
description = "Bubli desktop app"
authors = ["Project Hae Maeil"]
edition = "2021"

[lib]
name = "bubli_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
flate2 = "1"
encoding_rs = "0.8"
pdf-extract = "0.7"
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "2.3.2"
# 데스크탑 OS 알림 팝업(웹뷰에는 브라우저 Notification API가 없어서 네이티브 경로 필요).
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
notify = "6"
# On-device store for folder index, widget usage rollups, activity focus, sync outbox.
# "bundled" compiles SQLite in-tree so no system sqlite is required.
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tauri-plugin-dialog = "2.7.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# 수신 전화 팝업을 macOS 전체화면 앱의 별도 Space 위로도 띄우기 위한 NSWindow 직접 제어용.
# Tauri/wry가 내부적으로 이미 물고 있는 트랜지티브 의존성과 버전을 맞춘다.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSResponder", "NSWindow"] }
